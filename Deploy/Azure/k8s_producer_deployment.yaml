apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: pcdemoacr.azurecr.io/producer:latest
        imagePullPolicy: Always
        env:
        - name: "DOTNET_ENVIRONMENT"
          value: "Kubernetes"
        - name: Queue__ConnectionString
          valueFrom:
            secretKeyRef:
              name: azure-queue-connection
              key: connection
        ports:
        - containerPort: 3000
