apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
      - name: consumer
        image: pcdemoacr.azurecr.io/consumer:latest
        imagePullPolicy: Always
        env:
        - name: "DOTNET_ENVIRONMENT"
          value: "Kubernetes"
        - name: Queue__ConnectionString
          valueFrom:
            secretKeyRef:
              name: azure-queue-connection
              key: connection
